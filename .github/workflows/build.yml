name: Deploy Smart Contracts
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Create .env file
        run: |
          echo "USDC_CONTRACT_ADDRESS=${{ vars.USDC_CONTRACT_ADDRESS }}" >> .env
          echo "RELAYER_WALLET_PRIVATE_KEY=${{ secrets.RELAYER_WALLET_PRIVATE_KEY }}" >> .env
          echo "NETWORK=${{ vars.NETWORK }}" >> .env
          echo "CHAIN_ID=${{ vars.CHAIN_ID }}" >> .env
          echo "NETWORK_RPC_URL=${{ vars.NETWORK_RPC_URL }}" >> .env
          echo "VERIFIER_API_KEY=${{ secrets.VERIFIER_API_KEY }}" >> .env
          echo "VERIFIER_URL=${{ vars.VERIFIER_URL }}" >> .env
          # Only add FEE_RECIPIENT_ADDRESS if it's set
          if [ -n "${{ secrets.FEE_RECIPIENT_ADDRESS }}" ]; then
            echo "FEE_RECIPIENT_ADDRESS=${{ secrets.FEE_RECIPIENT_ADDRESS }}" >> .env
          fi

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --shallow
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Deploy contracts
        id: deploy
        run: |
          source .env
          # Deploy with verification
          forge script script/DeploymentScript.s.sol:DeploymentScript --rpc-url $NETWORK_RPC_URL --broadcast --verify --verifier blockscout --verifier-url $VERIFIER_URL -vvvv 2>&1 | tee deployment_output.txt

          # Extract addresses from the output (look for the actual hex addresses)
          IMPLEMENTATION_ADDRESS=$(grep "Implementation deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          FACTORY_ADDRESS=$(grep "Factory deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          
          # Verification happens automatically with --verify flag above
          # Manual verification only needed if automatic verification fails
          echo "Contracts deployed and verified automatically"
          echo "Implementation: $IMPLEMENTATION_ADDRESS"
          echo "Factory: $FACTORY_ADDRESS"

          # Get fee recipient for summary (from secrets now)
          FEE_RECIPIENT="${{ secrets.FEE_RECIPIENT_ADDRESS }}"
          if [ -z "$FEE_RECIPIENT" ]; then
            FEE_RECIPIENT_DISPLAY="Default (OWNER)"
          else
            FEE_RECIPIENT_DISPLAY="From secret"
          fi

          # Create a summary with important addresses
          echo "==================================================="
          echo "🏭 DEPLOYMENT COMPLETE"
          echo "==================================================="
          echo "Implementation: $IMPLEMENTATION_ADDRESS"
          echo "Factory: $FACTORY_ADDRESS"
          echo "Fee Recipient: $FEE_RECIPIENT_DISPLAY"
          echo "==================================================="
          echo "FACTORY ADDRESS FOR UI CONFIG: $FACTORY_ADDRESS"
          echo "===================================================" 
