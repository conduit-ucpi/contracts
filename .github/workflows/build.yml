name: Deploy Smart Contracts
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # ⚠️ AN EXACT VERSION, NOT `stable` AND NOT `nightly`.
          #
          # `stable` moves. It took this job from 1.7-era gas metering to 1.8.4, where each
          # test call is its own transaction, and every gas ceiling failed on a deploy tag
          # without a line of contract code changing (2026-10-05). The toolchain the suite
          # is validated against and the toolchain that deploys must be the same one.
          #
          # `nightly` is worse: its tags are created before their per-platform binaries
          # finish uploading, so the install can fail for reasons nothing here controls.
          #
          # To upgrade: install the new version locally, run `forge test`, re-measure the gas
          # ceilings in test/GasOptimisationSafetyNet.t.sol if they moved, then change this
          # pin (in BOTH workflows) in the same commit.
          version: v1.8.4

      # Exported into the job environment rather than a project .env file: recent
      # Foundry refuses to auto-load an unapproved .env from the project directory
      # ("refusing to load unapproved project dotenv files"). Real env vars are read
      # by forge on every version, so this needs no --allow-project-env flag.
      - name: Export deploy configuration
        run: |
          echo "USDC_CONTRACT_ADDRESS=${{ vars.USDC_CONTRACT_ADDRESS }}" >> "$GITHUB_ENV"
          echo "RELAYER_WALLET_PRIVATE_KEY=${{ secrets.RELAYER_WALLET_PRIVATE_KEY }}" >> "$GITHUB_ENV"
          echo "NETWORK=${{ vars.NETWORK }}" >> "$GITHUB_ENV"
          echo "CHAIN_ID=${{ vars.CHAIN_ID }}" >> "$GITHUB_ENV"
          echo "NETWORK_RPC_URL=${{ vars.NETWORK_RPC_URL }}" >> "$GITHUB_ENV"
          echo "VERIFIER_API_KEY=${{ secrets.VERIFIER_API_KEY }}" >> "$GITHUB_ENV"
          echo "VERIFIER_URL=${{ vars.VERIFIER_URL }}" >> "$GITHUB_ENV"
          # DEFAULT_ARBITER_ADDRESS is the fallback arbitrator Safe. It is baked into the
          # escrow IMPLEMENTATION's bytecode and can NEVER be changed afterwards - rotating
          # it means a new implementation, a new codehash, a new factory and a new
          # marketplace. There is deliberately no default: an unset value must fail the
          # deploy, not silently pick something.
          echo "DEFAULT_ARBITER_ADDRESS=${{ vars.DEFAULT_ARBITER_ADDRESS }}" >> "$GITHUB_ENV"
          # Fee recipient comes from the environment's FEE_RECIPIENT_ADDRESS
          # variable. Only written when set; the deploy script defaults the
          # recipient to the factory OWNER (relayer) when the variable is absent.
          if [ -n "${{ vars.FEE_RECIPIENT_ADDRESS }}" ]; then
            echo "FEE_RECIPIENT_ADDRESS=${{ vars.FEE_RECIPIENT_ADDRESS }}" >> "$GITHUB_ENV"
          fi
          # Sole authority for partner fee splits. Immutable on the factory; only written
          # when set, and the deploy script defaults it to OWNER (the relayer) otherwise.
          if [ -n "${{ vars.FEE_SPLIT_SIGNER_ADDRESS }}" ]; then
            echo "FEE_SPLIT_SIGNER_ADDRESS=${{ vars.FEE_SPLIT_SIGNER_ADDRESS }}" >> "$GITHUB_ENV"
          fi
          # Stamped into the implementation and factory bytecode as GIT_COMMIT().
          echo "GIT_COMMIT=0x${{ github.sha }}" >> "$GITHUB_ENV"

      # Fail before touching the chain rather than mid-broadcast. This value is
      # unchangeable once deployed, so a missing or malformed one must stop the run here.
      - name: Validate the fallback-arbitrator Safe
        run: |
          ADDR="${{ vars.DEFAULT_ARBITER_ADDRESS }}"
          if [ -z "$ADDR" ]; then
            echo "::error::DEFAULT_ARBITER_ADDRESS is not set for this environment."
            echo "::error::It is baked into the implementation bytecode and can never be changed - set it before deploying."
            exit 1
          fi
          if ! echo "$ADDR" | grep -Eq '^0x[a-fA-F0-9]{40}$'; then
            echo "::error::DEFAULT_ARBITER_ADDRESS is not a valid address: $ADDR"
            exit 1
          fi
          echo "Fallback arbitrator Safe: $ADDR"

      # ⚠️ NO `forge install` HERE, DELIBERATELY. This step used to run
      #    `forge install OpenZeppelin/openzeppelin-contracts --shallow` — unconditionally
      #    and with no version — which resolves OZ's default-branch HEAD at deploy time and
      #    OVERWRITES the pinned submodule. The bytecode that went on-chain was therefore
      #    built against whatever OZ shipped that morning, not the revision any test ran
      #    against, and it failed silently rather than erroring. The recursive checkout
      #    above already provides lib/openzeppelin-contracts at the locked revision; all
      #    this step has to do is prove it, before the chain is touched.
      - name: Verify pinned dependencies
        run: |
          if [ ! -f lib/openzeppelin-contracts/contracts/token/ERC20/IERC20.sol ]; then
            echo "::error::lib/openzeppelin-contracts is not populated - the recursive submodule checkout did not run"
            exit 1
          fi

          LOCKED=$(jq -r '."lib/openzeppelin-contracts".rev' foundry.lock)
          ACTUAL=$(git -C lib/openzeppelin-contracts rev-parse HEAD)
          echo "OpenZeppelin locked: $LOCKED"
          echo "OpenZeppelin actual: $ACTUAL"
          if [ "$LOCKED" != "$ACTUAL" ]; then
            echo "::error::OpenZeppelin is at $ACTUAL but foundry.lock pins $LOCKED - refusing to deploy bytecode built against an unpinned dependency"
            exit 1
          fi

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      # The off-chain address predictors - chainservice, the browser, the AP2 adapter - each
      # derive escrow addresses without asking the chain, so they are replicas of what this
      # factory does. They are pinned to the vector below.
      #
      # Regenerating it here is what stops a change to the CREATE2 salt leaving all of them
      # quietly agreeing with a stale answer: change the salt and this step fails until the
      # vector is committed, which is the prompt to go and update the consumers. Without it,
      # every predictor keeps passing its own tests while sending funds to an address nothing
      # can be deployed to.
      - name: Address vector is current
        run: |
          forge test --match-contract PredictVectorTest >/dev/null
          if ! git diff --quiet -- counterfactual-vectors.json; then
            echo "::error::counterfactual-vectors.json is out of date. The escrow address"
            echo "::error::derivation changed, so every off-chain predictor is now wrong."
            echo "::error::Run 'forge test --match-contract PredictVectorTest', commit the"
            echo "::error::result, and update chainservice / webapp / the AP2 adapter to match."
            git --no-pager diff -- counterfactual-vectors.json
            exit 1
          fi
          echo "Address vector matches the factory."

      # The ABI files at the repo root are what the services copy (chainservice keeps its own
      # under src/main/resources/abi and checks them against these at release time). They are
      # only a reference if they are true, so they are regenerated here and the build fails if
      # the committed copy differs — the prompt to commit the new ABI and go and update the
      # consumers, exactly as the address vector above does for the salt.
      #
      # ⚠️ AN EVENT WHOSE PARAMETER TYPES CHANGE GETS A NEW TOPIC HASH, and a consumer decoding
      #    with the old ABI stops seeing it without a single error. A narrowed getter type is
      #    harmless on the wire (every integer is a 32-byte word) but still shows up here, so a
      #    reviewer sees it happen rather than discovers it.
      - name: Committed ABIs are current
        run: |
          for name in EscrowContract EscrowContractFactory OfferVault OfferVaultFactory; do
            forge inspect "$name" abi --json > "$name.abi.json"
          done
          if ! git diff --quiet -- '*.abi.json'; then
            echo "::error::A committed *.abi.json no longer matches the compiled contract."
            echo "::error::Run 'forge inspect <Name> abi --json > <Name>.abi.json' for each, commit"
            echo "::error::the result, and update chainservice's copy under src/main/resources/abi."
            git --no-pager diff --stat -- '*.abi.json'
            git --no-pager diff -- '*.abi.json' | head -200
            exit 1
          fi
          echo "Committed ABIs match the compiled contracts."


      - name: Deploy contracts
        id: deploy
        run: |
          # Deploy with verification. DeployEscrow deploys ONLY the legacy
          # EscrowContract + EscrowContractFactory; the completion pair and the
          # marketplace are deployed separately, by hand. --retries/--delay
          # give blockscout's verification queue time to settle (it can sit in
          # "Pending in queue" longer than the default 5x5s budget).
          forge script script/DeployEscrow.s.sol:DeployEscrow --rpc-url $NETWORK_RPC_URL --broadcast --verify --verifier blockscout --verifier-url $VERIFIER_URL --retries 10 --delay 15 -vvvv 2>&1 | tee deployment_output.txt

          # Extract addresses from the output. The script logs a distinct line per
          # contract; match each precisely.
          IMPLEMENTATION_ADDRESS=$(grep "Implementation deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          FACTORY_ADDRESS=$(grep "Legacy factory deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)

          # Fail loudly if any address failed to parse, rather than emitting a
          # summary with blank fields (which silently breaks downstream config).
          for pair in "legacy implementation:$IMPLEMENTATION_ADDRESS" "legacy factory:$FACTORY_ADDRESS"; do
            if [ -z "${pair#*:}" ]; then
              echo "ERROR: could not parse the ${pair%%:*} address from deployment output" >&2
              exit 1
            fi
          done

          echo "Contracts deployed"
          echo "Legacy implementation: $IMPLEMENTATION_ADDRESS"
          echo "Legacy factory: $FACTORY_ADDRESS"

          # Fee recipient for the summary (vars are public, safe to print).
          FEE_RECIPIENT_DISPLAY="${{ vars.FEE_RECIPIENT_ADDRESS }}"
          if [ -z "$FEE_RECIPIENT_DISPLAY" ]; then
            FEE_RECIPIENT_DISPLAY="Default (OWNER)"
          fi
          FEE_SPLIT_SIGNER_DISPLAY="${{ vars.FEE_SPLIT_SIGNER_ADDRESS }}"
          if [ -z "$FEE_SPLIT_SIGNER_DISPLAY" ]; then
            FEE_SPLIT_SIGNER_DISPLAY="Default (OWNER)"
          fi

          # Create a summary with important addresses
          echo "==================================================="
          echo "🏭 DEPLOYMENT COMPLETE"
          echo "==================================================="
          echo "Legacy implementation:     $IMPLEMENTATION_ADDRESS"
          echo "Legacy factory:            $FACTORY_ADDRESS"
          echo "Git commit:                0x${{ github.sha }}"
          echo "Fee Recipient:             $FEE_RECIPIENT_DISPLAY"
          echo "Fee split signer:          $FEE_SPLIT_SIGNER_DISPLAY  (IMMUTABLE)"
          echo "Fallback arbiter (Safe):   ${{ vars.DEFAULT_ARBITER_ADDRESS }}  (IMMUTABLE)"
          echo "==================================================="
          echo "LEGACY FACTORY ADDRESS FOR UI CONFIG: $FACTORY_ADDRESS"
          echo "==================================================="
