name: Deploy Smart Contracts
run-name: Deploy ${{ github.event.head_commit.message }}
on:
  push:
    tags:
      - 'v*'
      - 'test*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Create .env file
        run: |
          echo "USDC_CONTRACT_ADDRESS=${{ vars.USDC_CONTRACT_ADDRESS }}" >> .env
          echo "RELAYER_WALLET_PRIVATE_KEY=${{ secrets.RELAYER_WALLET_PRIVATE_KEY }}" >> .env
          echo "NETWORK=${{ vars.NETWORK }}" >> .env
          echo "CHAIN_ID=${{ vars.CHAIN_ID }}" >> .env
          echo "NETWORK_RPC_URL=${{ vars.NETWORK_RPC_URL }}" >> .env
          echo "VERIFIER_API_KEY=${{ secrets.VERIFIER_API_KEY }}" >> .env
          echo "VERIFIER_URL=${{ vars.VERIFIER_URL }}" >> .env
          # Only add FEE_RECIPIENT_ADDRESS if it's set
          if [ -n "${{ secrets.FEE_RECIPIENT_ADDRESS }}" ]; then
            echo "FEE_RECIPIENT_ADDRESS=${{ secrets.FEE_RECIPIENT_ADDRESS }}" >> .env
          fi

      - name: Install dependencies
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --shallow
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test -vvv

      - name: Deploy contracts
        id: deploy
        run: |
          source .env
          # Deploy with verification. DeploymentScript deploys BOTH the legacy
          # and the completion (fan-out) implementation + factory. --retries/--delay
          # give blockscout's verification queue time to settle (it can sit in
          # "Pending in queue" longer than the default 5x5s budget).
          forge script script/DeploymentScript.s.sol:DeploymentScript --rpc-url $NETWORK_RPC_URL --broadcast --verify --verifier blockscout --verifier-url $VERIFIER_URL --retries 10 --delay 15 -vvvv 2>&1 | tee deployment_output.txt

          # Extract addresses from the output. The script logs a distinct line per
          # contract; match each precisely (a bare "Factory deployed at:" no longer
          # exists — the lines are now "Legacy factory..." / "Completion factory...").
          IMPLEMENTATION_ADDRESS=$(grep "Implementation deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          FACTORY_ADDRESS=$(grep "Legacy factory deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          FANOUT_IMPLEMENTATION_ADDRESS=$(grep "Completion implementation deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)
          FANOUT_FACTORY_ADDRESS=$(grep "Completion factory deployed at:" deployment_output.txt | grep -o "0x[a-fA-F0-9]\{40\}" | head -1)

          # Fail loudly if any address failed to parse, rather than emitting a
          # summary with blank fields (which silently breaks downstream config).
          for pair in "legacy implementation:$IMPLEMENTATION_ADDRESS" "legacy factory:$FACTORY_ADDRESS" \
                      "completion implementation:$FANOUT_IMPLEMENTATION_ADDRESS" "completion factory:$FANOUT_FACTORY_ADDRESS"; do
            if [ -z "${pair#*:}" ]; then
              echo "ERROR: could not parse the ${pair%%:*} address from deployment output" >&2
              exit 1
            fi
          done

          echo "Contracts deployed"
          echo "Legacy implementation: $IMPLEMENTATION_ADDRESS"
          echo "Legacy factory: $FACTORY_ADDRESS"
          echo "Completion implementation: $FANOUT_IMPLEMENTATION_ADDRESS"
          echo "Completion factory: $FANOUT_FACTORY_ADDRESS"

          # Get fee recipient for summary (from secrets now)
          FEE_RECIPIENT="${{ secrets.FEE_RECIPIENT_ADDRESS }}"
          if [ -z "$FEE_RECIPIENT" ]; then
            FEE_RECIPIENT_DISPLAY="Default (OWNER)"
          else
            FEE_RECIPIENT_DISPLAY="From secret"
          fi

          # Create a summary with important addresses
          echo "==================================================="
          echo "🏭 DEPLOYMENT COMPLETE"
          echo "==================================================="
          echo "Legacy implementation:     $IMPLEMENTATION_ADDRESS"
          echo "Legacy factory:            $FACTORY_ADDRESS"
          echo "Completion implementation: $FANOUT_IMPLEMENTATION_ADDRESS"
          echo "Completion factory:        $FANOUT_FACTORY_ADDRESS"
          echo "Fee Recipient:             $FEE_RECIPIENT_DISPLAY"
          echo "==================================================="
          echo "LEGACY FACTORY ADDRESS FOR UI CONFIG: $FACTORY_ADDRESS"
          echo "fanOutChainService env:"
          echo "  FANOUT_CONTRACT_FACTORY_ADDRESS      = $FANOUT_FACTORY_ADDRESS"
          echo "  FANOUT_ESCROW_IMPLEMENTATION_ADDRESS = $FANOUT_IMPLEMENTATION_ADDRESS"
          echo "==================================================="
